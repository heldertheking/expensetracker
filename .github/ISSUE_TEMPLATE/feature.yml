name: Feature
description: A new user-facing capability or improvement
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        The issue title becomes the branch name: `feature/EXTR-<issue number>-<title>`.
        Keep the title short and descriptive.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be built and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it is done? Include the tests expected.
      placeholder: |
        - [ ] ...
    validations:
      required: true
