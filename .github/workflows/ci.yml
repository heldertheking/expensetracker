name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Decides which test jobs are needed; lint runs regardless.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint (errors fail, warnings are annotated)
        run: npm run lint
      - name: Prettier (warn only)
        continue-on-error: true
        run: |
          if ! npm run format:check; then
            echo "::warning::Prettier found unformatted files, run 'npm run format'"
            echo "### Prettier: unformatted files" >> "$GITHUB_STEP_SUMMARY"
            npx prettier --list-different . | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace backend
      - run: npm test --workspace backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-reports
          path: backend/coverage

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace frontend
      - run: npm test --workspace frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-reports
          path: frontend/coverage
